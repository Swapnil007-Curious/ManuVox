name: Pages

# Builds web/ and deploys it to https://swapnil007-curious.github.io/manuvox/.
# One-time setup: repository Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# The sentence translator's URL comes from the repository variable WORKER_URL (Settings -> Secrets
# and variables -> Actions -> Variables) when it is set and non-blank, else from
# web/site.config.json (an unset variable expands to "", which never overrides the file). The build
# prints the URL it uses and fails if both are empty (REQUIRE_WORKER_URL): deploy the Worker in
# deploy/worker first (README, "Sentence translation").

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Fetch MediaPipe assets
        run: npm run fetch-assets
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /manuvox/
          # "" when the repository variable is unset: site.config.json's workerUrl is used then
          VITE_WORKER_URL: ${{ vars.WORKER_URL }}
          REQUIRE_WORKER_URL: "true"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
