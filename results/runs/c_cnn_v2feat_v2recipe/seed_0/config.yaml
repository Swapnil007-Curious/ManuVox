model:
  name: cnn
  channels: 192
  num_blocks: 6
  kernel_size: 5
  block_dropout: 0.2
  head_dropout: 0.3
processed_dir: /kaggle/working/processed_v2
split:
  mode: signer_independent
  n_test_signers: 4
  n_val_signers: 3
  val_fraction: 0.1
  test_fraction: 0.1
  seed: 42
epochs: 150
batch_size: 256
lr: 0.001
weight_decay: 0.05
warmup_fraction: 0.05
label_smoothing: 0.1
grad_clip: 1.0
patience: 30
augment:
  affine_p: 0.8
  temporal_p: 0.5
  jitter_p: 0.5
  rotation_deg: 15.0
  scale_min: 0.85
  scale_max: 1.15
  translate: 0.1
  window_min: 0.8
  jitter_std: 0.01
  frame_dropout_p: 0.5
  time_mask_p: 0.5
  landmark_mask_p: 0.3
  hand_rotation_p: 0.5
num_threads: 4
output_root: /kaggle/working/edge-vision/results/runs
experiment: c_cnn_v2feat_v2recipe
feature_set: v2
recipe: v2
ema_decay: 0.999
