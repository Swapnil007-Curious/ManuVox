# v3: the v2 hybrid (experiment d's architecture and recipe) trained on asl-signs train plus the
# ASL Citizen train split (mapped signs), with webcam-style augmentation. processed_dir is the
# combined dir that scripts/build_v3_dataset.py writes in kaggle/train_v3.ipynb.
#
# Validation is asl-signs val plus ASL Citizen val; the epoch is selected by the unweighted mean of
# the two val top-1 scores (val_selection: source_mean), so the 12.6k asl-signs val sequences do not
# drown out ASL Citizen's ~1k. No test data enters any decision.
#
# The split section matches the combined split file: asl-signs keeps its signer-independent split
# (4 test, 3 val signers, seed 42) and ASL Citizen its official one (11 test, 6 val signers).
experiment: e_hybrid_v3citizen
feature_set: v2
recipe: v3
val_selection: source_mean
model:
  name: hybrid
  dim: 256
  num_stages: 3
  conv_blocks: 2
  kernel_size: 17
  expansion_dim: 512
  conv_dropout: 0.2
  num_heads: 4
  ff_dim: 512
  attention_dropout: 0.1
  head_dropout: 0.4
  late_dropout_start: 0.5
processed_dir: /kaggle/working/processed_v3
split:
  mode: signer_independent
  n_test_signers: 15
  n_val_signers: 9
  val_fraction: 0.1
  test_fraction: 0.1
  seed: 42
epochs: 150
batch_size: 256
lr: 5.0e-4
weight_decay: 0.05
warmup_fraction: 0.05
label_smoothing: 0.1
grad_clip: 1.0
patience: 30
ema_decay: 0.999
augment:
  # Rotation (+-15 degrees), isotropic scale (0.85-1.15) and translation come from the affine
  # transform, as in v2; the webcam additions are aspect, fps and hand_drop.
  affine_p: 0.8
  temporal_p: 0.5
  jitter_p: 0.5
  frame_dropout_p: 0.5
  time_mask_p: 0.5
  landmark_mask_p: 0.3
  hand_rotation_p: 0.5
  aspect_p: 0.5
  aspect_max: 0.15
  fps_p: 0.3
  fps_min_ratio: 0.4
  hand_drop_p: 0.3
  hand_drop_max: 0.3
num_threads: 4
output_root: results/runs
